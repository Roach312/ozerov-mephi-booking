server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # реестр не регистрирует сам себя и не запрашивает собственный реестр
    register-with-eureka: false
    fetch-registry: false
  server:
    # быстрое вытеснение "мёртвых" экземпляров: удобно для разработки и docker-compose
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
